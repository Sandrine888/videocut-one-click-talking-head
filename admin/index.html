<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videocut License 管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      width: 100%;
      max-width: 450px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 24px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #555;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e1e5eb;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    .row {
      display: flex;
      gap: 12px;
    }
    .row .form-group {
      flex: 1;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }
    .result.success {
      display: block;
      background: #d4edda;
      border: 1px solid #c3e6cb;
    }
    .result.error {
      display: block;
      background: #f8d7da;
      border: 1px solid #f5c6cb;
    }
    .license-key {
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 24px;
      font-weight: bold;
      color: #155724;
      text-align: center;
      padding: 16px;
      background: white;
      border-radius: 8px;
      margin: 12px 0;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .license-key:hover {
      background: #f0f0f0;
    }
    .license-info {
      font-size: 13px;
      color: #666;
      text-align: center;
    }
    .copy-tip {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 8px;
    }
    .error-msg {
      color: #721c24;
      text-align: center;
    }
    .history {
      margin-top: 30px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }
    .history h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .history-key {
      font-family: monospace;
      font-weight: 600;
    }
    .history-email {
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Videocut License</h1>
    <p class="subtitle">发放新的 License Key</p>

    <form id="licenseForm">
      <div class="form-group">
        <label>用户邮箱</label>
        <input type="email" id="email" placeholder="user@example.com" required>
      </div>

      <div class="row">
        <div class="form-group">
          <label>设备数</label>
          <input type="number" id="maxDevices" value="2" min="1" max="10">
        </div>
        <div class="form-group">
          <label>有效天数</label>
          <input type="number" id="days" value="365" min="1" max="3650">
        </div>
      </div>

      <div class="form-group">
        <label>管理密钥</label>
        <input type="text" id="adminKey" placeholder="输入管理密钥" required>
      </div>

      <button type="submit" id="submitBtn">生成 License</button>
    </form>

    <div class="result" id="result"></div>

    <div class="history" id="history" style="display: none;">
      <h3>最近发放</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://osshzlvufywgyzoolqfd.supabase.co/functions/v1/create-license';

    // 从 localStorage 加载历史记录
    let history = JSON.parse(localStorage.getItem('videocut_license_history') || '[]');
    renderHistory();

    document.getElementById('licenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const resultDiv = document.getElementById('result');

      btn.disabled = true;
      btn.textContent = '生成中...';
      resultDiv.style.display = 'none';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            max_devices: parseInt(document.getElementById('maxDevices').value),
            days: parseInt(document.getElementById('days').value),
            admin_key: document.getElementById('adminKey').value,
          }),
        });

        const data = await response.json();

        if (data.success) {
          resultDiv.className = 'result success';
          const emailStatus = data.email_sent
            ? '<span style="color: #28a745;">✓ 邮件已发送</span>'
            : '<span style="color: #dc3545;">✗ 邮件发送失败</span>';
          resultDiv.innerHTML = `
            <div class="license-key" onclick="copyKey(this)">${data.license.key}</div>
            <p class="copy-tip">点击复制</p>
            <p class="license-info">
              邮箱: ${data.license.email} ${emailStatus}<br>
              设备数: ${data.license.max_devices} | 有效期至: ${data.license.expires_at}
            </p>
          `;

          // 保存到历史记录
          history.unshift({
            key: data.license.key,
            email: data.license.email,
            date: new Date().toLocaleDateString(),
          });
          if (history.length > 10) history.pop();
          localStorage.setItem('videocut_license_history', JSON.stringify(history));
          renderHistory();

          // 清空邮箱输入
          document.getElementById('email').value = '';
        } else {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `<p class="error-msg">${data.error || '生成失败'}</p>`;
        }
      } catch (err) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `<p class="error-msg">网络错误，请重试</p>`;
      }

      btn.disabled = false;
      btn.textContent = '生成 License';
    });

    function copyKey(el) {
      navigator.clipboard.writeText(el.textContent);
      el.style.background = '#c3e6cb';
      setTimeout(() => el.style.background = 'white', 500);
    }

    function renderHistory() {
      const historyDiv = document.getElementById('history');
      const listDiv = document.getElementById('historyList');

      if (history.length === 0) {
        historyDiv.style.display = 'none';
        return;
      }

      historyDiv.style.display = 'block';
      listDiv.innerHTML = history.map(item => `
        <div class="history-item">
          <span class="history-key" onclick="navigator.clipboard.writeText('${item.key}')" style="cursor:pointer">${item.key}</span>
          <span class="history-email">${item.email}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
