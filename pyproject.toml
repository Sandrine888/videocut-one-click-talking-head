[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videocut"
version = "0.1.0"
description = "智能口播视频剪辑工具 - 自动识别口误，一键生成精剪视频"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Videocut Team"}
]
keywords = ["video", "editing", "speech", "transcription", "AI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "click>=8.0.0",
    "httpx>=0.24.0",
    "cryptography>=41.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "funasr>=1.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "rich>=13.0.0",
    "pyJianYingDraft>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
jianying = [
    "pyJianYingDraft>=0.1.0",
]

[project.scripts]
videocut = "videocut.cli:main"

[project.urls]
Homepage = "https://github.com/videocut/videocut"
Documentation = "https://github.com/videocut/videocut#readme"
Issues = "https://github.com/videocut/videocut/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["videocut*"]

[tool.setuptools.package-data]
videocut = ["template_defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
